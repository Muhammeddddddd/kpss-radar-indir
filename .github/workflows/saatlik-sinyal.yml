name: Saatlik bildirim sinyali

# KPSS Radar sunucusundan, bildirimleri açık telefonlara saatte bir "ilanları kontrol et"
# sinyali gönderir; telefonlar Android'in kendi zamanlayıcısını beklemeden yeni ilanlara bakar.
# Sunucu bu sinyali en fazla 50 dakikada bir yollar; fazladan çağrı bir şey değiştirmez.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sunucuyu uyandır ve sinyal gönder
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 -X POST https://kpss-radar-api.onrender.com/api/push/tick; then echo; exit 0; fi
            sleep 20
          done
          exit 1
